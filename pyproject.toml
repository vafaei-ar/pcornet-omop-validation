[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcornet-omop-validation"
version = "0.1.0"
description = "Reproducible profiling, ETL, and validation of PCORnet-to-OMOP transformations"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
etl = [
  "SQLAlchemy>=2.0",
  "pyodbc>=5.0",
]
analysis = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
]
figures = [
  "matplotlib>=3.8",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
pcornet-omop-profile = "pcornet_omop_validation.cli:main"
pcornet-omop-etl = "pcornet_omop_validation.etl_cli:main"
pcornet-omop-figures = "pcornet_omop_validation.study.publication_figures:main"

[tool.setuptools.packages.find]
where = ["src"]
