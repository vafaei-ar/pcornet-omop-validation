etl:
  cdm_version: "5.4.2"
  backend: "sqlserver"
  reset_target: false
  fail_on_missing_required_table: true
  fail_on_existing_target_rows: true
  interactive: true

source:
  parquet_dir: "/usr/local/datasets/OMOP/PCORnet_parquet"
  table_prefix: "PCORnet_"

sqlserver:
  server: "localhost"
  # Use a new database so the prior OMOP build remains untouched for comparison.
  database: "OMOP_VALIDATED"
  create_database_if_missing: true
  user: "SA"
  password_env: "OMOP_SQL_PASSWORD"
  driver: "ODBC Driver 18 for SQL Server"
  trust_server_certificate: true
  source_schema: "dbo"
  target_schema: "dbo"

downloads:
  # Public dependencies may be downloaded and checksum/version recorded automatically.
  auto_download_public_assets: true
  cache_dir: ".cache/pcornet-omop-etl"
  common_data_model:
    source: "OHDSI/CommonDataModel"
    release: "v5.4.2"
  data_quality_dashboard:
    enabled: false
    source: "OHDSI/DataQualityDashboard"

vocabulary:
  # If this directory does not contain an Athena bundle, `pcornet-omop-etl acquire`
  # starts the Athena acquisition workflow. Athena authentication/licensing still
  # requires the authorized user; after download the ETL validates, extracts,
  # fingerprints, versions, and configures the bundle automatically.
  directory: "/usr/local/datasets/OMOP/Athena"
  acquisition:
    download_dir: "~/Downloads"
    # Optional for institutions/workflows that can provide an authorized bundle URL.
    # The URL is read from the environment and is never stored in the config/report.
    bundle_url_env: "ATHENA_BUNDLE_URL"
  require_files:
    - CONCEPT.csv
    - CONCEPT_RELATIONSHIP.csv
    - CONCEPT_ANCESTOR.csv
    - VOCABULARY.csv
    - DOMAIN.csv
    - CONCEPT_CLASS.csv
    - RELATIONSHIP.csv
  require_vocabularies:
    - SNOMED
    - ICD10CM
    - ICD9CM
    - RxNorm
    - LOINC
    - CPT4

policies:
  # "ask" means interactive runs prompt the user. Non-interactive runs fail until
  # the decision is explicitly configured.
  missing_required_date: "ask"
  unmapped_standard_concept: "ask"
  heterogeneous_observation_domain: "ask"
  condition_sources: "ask"

output:
  parquet_dir: "/usr/local/datasets/OMOP/OMOP_validated_parquet"
  audit_dir: "results/etl_audit"
  decision_log: "results/etl_audit/decisions.yaml"
  run_manifest: "results/etl_audit/run_manifest.json"

stages:
  - preflight
  - acquire_public_dependencies
  - acquire_vocabulary
  - resolve_decisions
  - schema
  - vocabulary
  - staging
  - person
  - observation_period
  - visit_occurrence
  - condition_occurrence
  - procedure_occurrence
  - drug_exposure
  - measurement
  - observation
  - death
  - location
  - export
  - reconcile
